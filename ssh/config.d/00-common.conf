# Shared ssh options, both platforms. Linked by bash/setup.sh into ~/.ssh/config.d/.
#
# Anything macOS-only belongs in 10-Darwin.conf instead, NOT here: an option OpenSSH does not recognize is
# fatal, not ignored — it aborts with "terminating, 1 bad configuration options" and ssh stops working
# entirely. That is what put UseKeychain out of reach of a shared file.

Host *
  # Cache a key in the agent on first use, so a passphrase is typed once per agent rather than once per push.
  # Portable: OpenSSH 7.2+ on both platforms. The macOS keychain half of this is in 10-Darwin.conf.
  AddKeysToAgent yes

# Reach github.com through the *forwarded* agent when there is one, rather than whatever bashrc put on the shared
# link. github.com only knows the laptop's keys — check with `curl -sS https://github.com/adevore3.keys`, which
# serves exactly the active ones — so once bashrc started preferring a persistent local agent on the cloudvm (see
# the SSH-agent notes in CLAUDE.md), pushes there began failing `Permission denied (publickey)` while code.corp,
# which does know the cloudvm's key, kept working. Registering the cloudvm's key on github would work too, but this
# needs no key management and no second passphrase.
#
# Not a plain `Host` block, because IdentityAgent naming an unset variable resolves to *no agent at all* rather
# than falling back — that would break github on the macbook, which has no forwarded socket and where the linked
# agent is the right answer. The exec gate keeps the block inert unless bashrc exported the variable, and the
# trailing `.` in the pattern makes set-but-empty count as unset. Verified against all four cases: set, empty,
# unset, and a non-github host.
#
# Two things that will mislead you when checking this: `ssh -G github.com` prints the literal
# `$SSH_AUTH_SOCK_FORWARDED`, since expansion happens at connect time, and `ssh -G` reports the *gate's* verdict
# only by whether identityagent appears at all. Confirm with `ssh -T git@github.com`, which should greet adevore3.
Match host github.com exec "env | grep -q '^SSH_AUTH_SOCK_FORWARDED=.'"
  IdentityAgent $SSH_AUTH_SOCK_FORWARDED
