# macOS-only ssh options. Linked by bash/setup.sh only when `uname -s` is Darwin.
#
# UseKeychain is an Apple extension. On Linux OpenSSH it is not merely ignored — it aborts the whole config
# with "Bad configuration option: usekeychain", taking ssh down with it. Hence the per-platform file.

Host *
  # Store the passphrase in the login keychain, so it survives reboots and the agent reloads it silently.
  # Needs a one-time `ssh-add --apple-use-keychain ~/.ssh/id_ed25519` to put it there in the first place.
  UseKeychain yes
